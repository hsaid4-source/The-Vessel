<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Vessel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- OPENING SEQUENCE -->
    <div id="intro-screen">
      <p class="intro-line" id="line1">We've been building a copy of you your whole life.</p>
      <p class="intro-line" id="line2">This is what we have so far.</p>
      <div id="vessel-preview"></div>
      <p class="intro-line" id="line3">Let's see how much more you give us.</p>
      <h1 id="game-title">THE VESSEL</h1>
      <button id="start-btn">Begin</button>
    </div>

    <!-- CHARACTER CREATION -->
    <div id="creation-screen" class="hidden">
      <h2>Who are you?</h2>
      <input type="text" id="player-name" placeholder="Enter your name" />
      <select id="player-ethnicity">
        <option value="">Select your background</option>
        <option value="black">Black / African American</option>
        <option value="white">White / Caucasian</option>
        <option value="hispanic">Hispanic / Latino</option>
        <option value="asian">Asian / Pacific Islander</option>
        <option value="middleeastern">Middle Eastern / North African</option>
        <option value="indigenous">Indigenous / Native American</option>
        <option value="mixed">Mixed / Multiracial</option>
        <option value="other">Other</option>
      </select>
      <button id="confirm-btn">This is me</button>
    </div>

<!-- GAME SCREEN -->
<div id="game-screen" class="hidden">

  <!-- TOP BAR -->
  <div id="top-bar">
    <span id="day-label">DAY 1 — CHILDHOOD</span>
    <span id="vessel-label">VESSEL: <span id="vessel-percent">0</span>%</span>
  </div>

  <!-- MAIN LAYOUT -->
  <div id="main-layout">

    <!-- LEFT: SCENE -->
    <div id="scene-panel">
      <p id="scene-text"></p>
    </div>

    <!-- RIGHT: STATS + VESSEL -->
    <div id="stats-panel">

      <div class="stat-row">
        <span class="stat-label">🍽 Hunger</span>
        <div class="stat-bar-bg">
          <div class="stat-bar" id="bar-hunger"></div>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">😊 Happiness</span>
        <div class="stat-bar-bg">
          <div class="stat-bar" id="bar-happiness"></div>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">❤️ Health</span>
        <div class="stat-bar-bg">
          <div class="stat-bar" id="bar-health"></div>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">🧠 Stress</span>
        <div class="stat-bar-bg">
          <div class="stat-bar-stress" id="bar-stress"></div>
        </div>
      </div>

      <!-- VESSEL OUTLINE -->
      <div id="vessel-container">
        <div id="vessel-body">
          <div id="vessel-fill"></div>
        </div>
        <p id="vessel-tag">THE VESSEL</p>
      </div>

    </div>
  </div>

  <!-- BOTTOM: DECISION BOX -->
  <div id="decision-box">
    <p id="decision-text"></p>
    <div id="choice-buttons">
      <button class="choice-btn" id="choice-a"></button>
      <button class="choice-btn" id="choice-b"></button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
